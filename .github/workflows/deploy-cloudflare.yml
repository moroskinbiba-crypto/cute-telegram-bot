name: Deploy automatic Telegram bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install

      - name: Upload Telegram bot token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Generate webhook secrets
        run: |
          echo "TELEGRAM_WEBHOOK_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "WEBHOOK_SETUP_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Upload webhook secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_WEBHOOK_SECRET: ${{ env.TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_SETUP_SECRET: ${{ env.WEBHOOK_SETUP_SECRET }}
        run: |
          printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          printf '%s' "$WEBHOOK_SETUP_SECRET" | npx wrangler secret put WEBHOOK_SETUP_SECRET

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler deploy 2>&1 | tee deploy.log

      - name: Configure Telegram webhook
        env:
          WEBHOOK_SETUP_SECRET: ${{ env.WEBHOOK_SETUP_SECRET }}
        run: |
          set -e
          WORKER_URL="$(grep -oE 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -1)"
          if [ -z "$WORKER_URL" ]; then
            echo "Could not detect workers.dev URL"
            cat deploy.log
            exit 1
          fi

          curl -fsS -X POST "$WORKER_URL/setup"             -H "X-Setup-Secret: $WEBHOOK_SETUP_SECRET"

          echo "Webhook configured at $WORKER_URL/telegram"

      - name: Disable legacy GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          for FILE in             ".github/workflows/send-message.yml"             ".github/workflows/test-bot.yml"
          do
            SHA="$(gh api "repos/$REPOSITORY/contents/$FILE" --jq '.sha' 2>/dev/null || true)"

            if [ -n "$SHA" ]; then
              gh api                 --method DELETE                 "repos/$REPOSITORY/contents/$FILE"                 -f message="Disable legacy runtime workflow"                 -f sha="$SHA"
            fi
          done

          echo "Legacy scheduled/test workflows disabled."
