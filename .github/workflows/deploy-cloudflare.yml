name: Deploy Cloudflare Telegram bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WORKER_URL: https://cute-telegram-bot.dssmirnov2.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --no-audit --no-fund

      - name: Validate Worker syntax
        run: node --check worker/index.js

      - name: Upload Telegram bot token
        run: printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Refresh Telegram webhook
        run: curl --fail --silent --show-error "$WORKER_URL/"

      - name: Verify Worker health
        run: curl --fail --silent --show-error "$WORKER_URL/health"
